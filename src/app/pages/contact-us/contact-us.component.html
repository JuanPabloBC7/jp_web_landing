<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <h2 class="mb-4 text-center">Contáctanos</h2>
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" novalidate>
        <div class="mb-3">
          <label for="name" class="form-label">Nombre</label>
          <input
            id="name"
            type="text"
            class="form-control"
            formControlName="name"
            [ngClass]="{
              'is-invalid': contactForm.get('name')?.invalid && (submitted || contactForm.get('name')?.touched || contactForm.get('name')?.dirty), 
              'is-valid': contactForm.get('name')?.valid && (submitted || contactForm.get('name')?.touched || contactForm.get('name')?.dirty)
            }"
            placeholder="Tu nombre"
          />
          <div *ngIf="contactForm.get('name')?.invalid && (submitted || contactForm.get('name')?.touched || contactForm.get('name')?.dirty)" class="invalid-feedback">
            El nombre es requerido.
          </div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            [ngClass]="{
              'is-invalid': contactForm.get('email')?.invalid && (submitted || contactForm.get('email')?.touched || contactForm.get('email')?.dirty), 
              'is-valid': contactForm.get('email')?.valid && (submitted || contactForm.get('email')?.touched || contactForm.get('email')?.dirty)
            }"
            placeholder="tu@email.com"
          />
          <div *ngIf="contactForm.get('email')?.invalid && (submitted || contactForm.get('email')?.touched || contactForm.get('email')?.dirty)" class="invalid-feedback">
            Ingresa un correo válido.
          </div>
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Mensaje</label>
          <textarea
            id="message"
            rows="5"
            class="form-control"
            formControlName="message"
            [ngClass]="{
              'is-invalid': contactForm.get('message')?.invalid && (submitted || contactForm.get('message')?.touched || contactForm.get('message')?.dirty), 
              'is-valid': contactForm.get('message')?.valid && (submitted || contactForm.get('message')?.touched || contactForm.get('message')?.dirty)
            }"
            placeholder="¿En qué podemos ayudarte?"
          ></textarea>
          <div *ngIf="contactForm.get('message')?.invalid && (submitted || contactForm.get('message')?.touched || contactForm.get('message')?.dirty)" class="invalid-feedback">
            El mensaje es requerido.
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          Enviar mensaje
        </button>
        <div *ngIf="success" class="alert alert-success mt-3">
          ¡Mensaje enviado correctamente!
        </div>
      </form>
    </div>
  </div>
</div>
