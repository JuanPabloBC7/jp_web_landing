<section class="technology-evidence technology-evidence--html mx-md-5">
  <article class="technology-evidence__card">
    <header class="technology-evidence__header">
      <span class="technology-evidence__identity"><i class="devicon-html5-plain" aria-hidden="true"></i></span>
      <div><span class="technology-evidence__context">{{ 'pages.experience.context.frontend' | translate }}</span>
      <h3>{{ 'pages.experience.frontend.html.title' | translate }}</h3>
      <p [innerHTML]="'pages.experience.frontend.html.description' | translate"></p></div>
    </header>
    <h4>{{ 'pages.experience.frontend.html.evidenceTitle' | translate }}</h4>
    <ul class="evidence-grid">
      <li *ngFor="let s of skills"><span aria-hidden="true">✓</span><div [innerHTML]="s"></div></li>
    </ul>
    <footer class="technology-evidence__footer">
      <span>{{ 'pages.experience.actions.continue' | translate }}</span>
      <a href="/projects/notes">{{ 'pages.experience.actions.notes' | translate }} <span aria-hidden="true">→</span></a>
    </footer>
  </article>
</section>
