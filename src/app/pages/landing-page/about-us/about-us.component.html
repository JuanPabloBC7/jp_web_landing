<section class="py-5">
  <div class="row text-center mb-5">
    <div class="col-12">
      <h2 class="fw-bold mb-3">{{ 'pages.aboutUs.title' | translate }}</h2>
      <p class="lead text-secondary">{{ 'pages.aboutUs.description' | translate }}</p>
    </div>
  </div>

  <div class="row text-center">
    <div class="col-md-4 mb-4" [ngClass]="item?.show == 'true' ? 'd-block' : 'd-none'" *ngFor="let item of translateAboutUs">
      <div class="card border-0 shadow-sm h-100" [ngClass]="item?.bgClass">
        <div class="card-body">
          <i [class]="'fs-1 mb-3 ' + item?.icon"></i>
          <h5 class="card-title fw-bold">{{ item?.title }}</h5>
        </div>
      </div>
    </div>
  </div>
</section>
