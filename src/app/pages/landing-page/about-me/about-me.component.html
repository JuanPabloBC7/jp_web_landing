<section class="about-section py-5">
  <div class="personal-signature" aria-hidden="true">
    <span>JP</span>
    <small>build · evolve · solve</small>
  </div>

  <div class="section-heading text-center mx-auto mb-5">
    <span class="eyebrow">{{ 'pages.aboutUs.eyebrow' | translate }}</span>
    <h2>{{ 'pages.aboutUs.title' | translate }}</h2>
    <p>{{ 'pages.aboutUs.description' | translate }}</p>
  </div>

  <div class="about-grid">
    <ng-container *ngFor="let item of translateAboutUs">
      <article class="value-card" *ngIf="item?.show == 'true'">
        <div class="value-icon" [ngClass]="item?.bgClass">
          <i [class]="item?.icon" aria-hidden="true"></i>
        </div>
        <h3>{{ item?.title }}</h3>
        <p>{{ item?.description }}</p>
      </article>
    </ng-container>
  </div>
</section>
