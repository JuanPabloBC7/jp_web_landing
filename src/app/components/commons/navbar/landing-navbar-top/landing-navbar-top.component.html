<header class="shadow-sm border-bottom position-fixed w-100 z-3">
  <div class="container position-relative">
    <div class="d-flex justify-content-between align-items-center h-100 py-2">
      <a routerLink="/" class="d-flex align-items-center text-decoration-none" [attr.aria-label]="'general.goHome' | translate">
        <div class="bg-danger p-2 rounded">
          <i class="text-white fs-4">{{ 'configuration.icon' | translate }}</i>
        </div>
        <span class="text-danger fs-4 fw-bold ms-2">{{ 'configuration.name' | translate }}</span>
      </a>

      <!-- Controles de navegación para todos los tamaños -->
      <div class="d-flex align-items-center gap-2 gap-sm-3">
        <label class="btn switch">
          <input type="checkbox" id="landing-theme" [checked]="!isDark" (click)="toggleTheme()" [attr.aria-label]="appearance" />
          <span class="slider" [ngbTooltip]="appearance">
            <div class="star star_1"></div>
            <div class="star star_2"></div>
            <div class="star star_3"></div>
            <svg viewBox="0 0 16 16" class="cloud_1 cloud">
              <path transform="matrix(.77976 0 0 .78395-299.99-418.63)" fill="#fff" d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925"></path>
            </svg>
          </span>
        </label>
        <!-- <button (click)="toggleTheme()" class="btn d-inline-block ms-auto me">
          <i class="fa-solid fs-5" [ngClass]="isDark ? 'fa-moon' : 'fa-sun'" [ngbTooltip]="appearance"></i>
        </button> -->
        <div ngbDropdown class="d-inline-block me">
          <button class="btn w-100 dropdown-toggle" id="landingLanguageDropdown" ngbDropdownToggle [attr.aria-label]="'configuration.language.title' | translate"><i class="fa-solid fa-language" aria-hidden="true"></i></button>
          <div ngbDropdownMenu aria-labelledby="landingLanguageDropdown">
            <button class="dropdown-item" (click)="setLanguage('es')" ngbDropdownItem>{{ 'configuration.language.options.spanish' | translate }}</button>
            <button class="dropdown-item" (click)="setLanguage('en')" ngbDropdownItem>{{ 'configuration.language.options.english' | translate }}</button>
          </div>
        </div>
        <button
          type="button"
          class="btn menu-toggle"
          (click)="isOpen = !isOpen"
          [attr.aria-expanded]="isOpen"
          aria-controls="landingNavigation"
          [attr.aria-label]="'configuration.navbar.title' | translate">
          <i class="fa-solid" [ngClass]="isOpen ? 'fa-bars-staggered' : 'fa-bars'" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <!-- Menú desplegable -->
    <div *ngIf="isOpen" id="landingNavigation" class="navigation-panel">
      <div class="px-3 py-2">
        <ng-container *ngFor="let item of navigation">
          <a
            *ngIf="item.routerLink"
            [routerLink]="item.routerLink"
            [fragment]="item.fragment"
            class="d-block px-2 py-2 rounded text-decoration-none fw-medium mb-1"
            [ngClass]="{
              'text-primary bg-primary bg-opacity-10 fw-bold': isActive(item),
              'text-secondary': !isActive(item)
            }"
            [attr.aria-current]="isActive(item) ? 'page' : null"
            (click)="isOpen = false">
            {{ item.value }}
          </a>
        </ng-container>
        <!-- <a routerLink="/contact" class="btn btn-primary w-100 mt-2" (click)="isOpen = false">Get Started</a> -->
      </div>
    </div>
  </div>
</header>
